<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Café — play with family</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbf3e7; --bg2: #f3e2ce; --panel: #fffdf9; --line: #e3c9a8; --text: #3a1f1a; --muted: #8a6a54;
  --cherry: #d6335c; --cherry-ink: #ffffff; --gold: #e3a93b; --gold-ink: #3a2200; --teal: #3f8f89;
  --paper: #fffdf9; --card-line: #d8b48c; --ink: #3a1f1a; --shadow: 0 4px 12px rgba(90, 50, 20, .18);
  --ff-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --ff-body: "Mulish", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #241220; --bg2: #2e1729; --panel: #34192e; --line: #5a2e4e; --text: #f6e9e0; --muted: #c79fb8;
    --cherry: #ff6b8b; --cherry-ink: #2b0512; --gold: #f0c24b; --gold-ink: #2b1900; --teal: #6fc2bb;
    --paper: #f3e7dd; --card-line: #b98ca0; --ink: #3a1f1a; --shadow: 0 6px 16px rgba(10, 2, 8, .55);
  }
}
:root[data-theme="dark"] {
  --bg: #241220; --bg2: #2e1729; --panel: #34192e; --line: #5a2e4e; --text: #f6e9e0; --muted: #c79fb8;
  --cherry: #ff6b8b; --cherry-ink: #2b0512; --gold: #f0c24b; --gold-ink: #2b1900; --teal: #6fc2bb;
  --paper: #f3e7dd; --card-line: #b98ca0; --ink: #3a1f1a; --shadow: 0 6px 16px rgba(10, 2, 8, .55);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.45 var(--ff-body); min-height: 100vh; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: not-allowed; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 10px 12px 0; display: flex; flex-direction: column; gap: 12px; min-height: 100vh; }
h1, h2, h3 { font-family: var(--ff-display); margin: 0; }
.btn { border: 1.5px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 16px; min-height: 44px; font-weight: 700; font-family: var(--ff-body); }
.btn:hover { border-color: var(--cherry); }
.btn.primary { background: var(--cherry); color: var(--cherry-ink); border-color: var(--cherry); }
.btn.ghost { background: transparent; }
input[type="text"] { border: 1.5px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%; }

/* ---------- landing / lobby ---------- */
.centerCard { max-width: 460px; margin: 40px auto; background: var(--panel); border: 1.5px solid var(--line); border-radius: 18px; padding: 24px 22px; box-shadow: var(--shadow); }
.centerCard h1 { font-size: 22px; margin-bottom: 6px; }
.centerCard p.sub { color: var(--muted); margin: 0 0 20px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .03em; }
.seg { display: flex; gap: 8px; margin-bottom: 16px; }
.seg .btn { flex: 1; }
.seg .btn.active { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.err { color: var(--cherry); font-weight: 600; font-size: 13.5px; min-height: 1.3em; margin: 8px 0 0; }
.roomcode { font: 800 34px/1 var(--ff-display); letter-spacing: .08em; text-align: center; padding: 14px; background: var(--bg2); border-radius: 12px; margin: 4px 0 12px; }
.sharebar { display: flex; gap: 8px; margin-bottom: 18px; }
.sharebar input { flex: 1; font-size: 13px; }
.playerlist { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 8px; }
.playerlist li { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--bg2); border-radius: 10px; font-weight: 700; }
.playerlist li .tag { font-size: 11px; font-weight: 700; background: var(--gold); color: var(--gold-ink); padding: 2px 8px; border-radius: 99px; }
.hint { color: var(--muted); font-size: 13px; margin-top: 6px; }

/* ---------- top bar (game) ---------- */
.top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.top h1 { font-size: 16px; flex: 1 1 auto; }
.top h1 small { display: block; font: 600 11px/1.3 var(--ff-body); color: var(--muted); margin-top: 3px; }

/* ---------- opponents ---------- */
.opps { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.opp { text-align: left; background: var(--panel); border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 12px; }
.opp.active { border-color: var(--cherry); box-shadow: 0 0 0 2px var(--cherry); }
.oname { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-weight: 800; font-family: var(--ff-display); font-size: 14px; }
.oname .meta { font-weight: 600; font-size: 12.5px; color: var(--muted); font-family: var(--ff-body); }
.ogroups { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; min-height: 24px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 99px; border: 1.5px solid var(--set); background: transparent; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--set); flex: none; }
.chip .dot.has-wild { background: conic-gradient(var(--set) 0deg 180deg, var(--gold) 180deg 360deg); }
.chip.done { background: var(--set); color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .5); }
.empty-note { color: var(--muted); font-size: 12.5px; }

/* ---------- table ---------- */
.table { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--bg2); border: 1.5px solid var(--line); border-radius: 18px; padding: 12px; }
.piles { display: flex; gap: 8px; }
.pile { width: 62px; height: 86px; border-radius: 10px; display: grid; place-items: center; text-align: center; font-size: 11px; font-weight: 700; line-height: 1.2; padding: 4px; }
.pile b { display: block; font: 800 20px/1 var(--ff-display); margin-bottom: 4px; }
.pile.draw { background: repeating-linear-gradient(135deg, var(--line) 0 6px, transparent 6px 12px), var(--panel); border: 1.5px solid var(--line); }
.pile.play { border: 1.5px dashed var(--line); color: var(--muted); }
.status { min-width: 0; }
.status .now { font: 700 14.5px/1.3 var(--ff-display); margin: 0 0 6px; }
.status .now.mine { color: var(--cherry); }
.ticker { margin: 0; padding: 0; list-style: none; font-size: 12px; color: var(--muted); display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px 12px; }
.ticker li:last-child { color: var(--text); font-weight: 600; }

/* ---------- my area ---------- */
.me { display: grid; gap: 10px; }
.me h2 { font-size: 13px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.me h2 span { font: 600 12.5px var(--ff-body); color: var(--muted); }
.groups { display: flex; flex-wrap: wrap; gap: 10px; min-height: 60px; }
.grp { border: 2px solid var(--set); border-radius: 16px; background: var(--panel); padding: 8px; max-width: 100%; }
.grp.done { box-shadow: 0 0 0 2px var(--set); }
.ghead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font: 700 14px/1.2 var(--ff-display); margin-bottom: 6px; color: var(--set); }
.ghead .cnt { font: 600 12px var(--ff-body); color: var(--muted); }
.ghead .ok { color: var(--teal); font-weight: 700; font-size: 12px; }
.gcards { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--gold); color: var(--gold-ink); margin: 6px 6px 0 0; }
.empty-groups { color: var(--muted); font-size: 13px; padding: 8px 2px; }

/* ---------- hand ---------- */
.handbar { position: sticky; bottom: 0; margin: 0 -12px; padding: 8px 12px 12px; background: linear-gradient(to top, var(--bg) 78%, transparent); z-index: 5; margin-top: auto; }
.handbar h2 { margin: 0 0 6px; font: 700 12px/1.2 var(--ff-display); color: var(--muted); }
.hand { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; }
.hand-empty { color: var(--muted); font-size: 13px; padding: 20px 4px; }

/* ---------- cards ---------- */
.card { position: relative; display: flex; flex-direction: column; flex: none; width: 8.6em; height: 12em; font-size: 13px; padding: 0; text-align: left; border: 1.5px solid var(--card-line); border-radius: .85em; background: var(--paper); color: var(--ink); overflow: hidden; box-shadow: var(--shadow); }
.card.sm { font-size: 10.5px; width: 7.4em; height: 9.2em; }
.card.dim { opacity: .5; }
.card:disabled { cursor: default; }
.band { display: flex; align-items: center; min-height: 2.6em; padding: .4em .45em; background: var(--set, #b3577a); }
.band span { font: 700 .68em/1.15 var(--ff-body); color: #fff; background: rgba(30, 10, 20, .5); padding: .15em .45em; border-radius: .35em; }
.card.has-badge .band { padding-left: 2.4em; }
.k-wild .band, .k-rent .band { background: linear-gradient(105deg, var(--a) 0 50%, var(--b) 50% 100%); }
.k-multi .band, .k-rent.wildrent .band { background: conic-gradient(from 30deg, #d6335c, #e3a93b, #6fae5a, #3f8f89, #9a6cd0, #d6335c); }
.k-action .band { background: #7c4a86; }
.k-money { background: linear-gradient(160deg, var(--mv-a, #fbdc8d), var(--mv-b, #e3a93b)); }
.k-money .band { background: transparent; min-height: 1.6em; }
.k-money .band span { background: rgba(50, 25, 5, .5); }
.badge { position: absolute; top: .4em; left: .4em; width: 1.95em; height: 2.15em; display: grid; place-items: center; z-index: 2; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: var(--gold); color: var(--gold-ink); font: 700 1em/1 var(--ff-display); }
.cname { padding: .5em .55em 0; font: 700 1.05em/1.2 var(--ff-body); }
.cbody { padding: .3em .55em .5em; font-size: .8em; line-height: 1.3; color: #5c4632; margin-top: auto; }
.card.sm .cbody { display: none; }
.bigv { display: block; text-align: center; font: 800 3em/1 var(--ff-display); color: #3a2200; padding-top: .1em; }
.k-money .cname { text-align: center; font-size: .82em; color: #3a2200; padding-top: 0; }
.k-money .cbody { color: #3a2200; text-align: center; }
.mini-ladder { display: block; padding: 0 .5em .45em; font: 700 .7em/1.25 var(--ff-body); color: #5c4632; }
.tag { position: absolute; right: .35em; bottom: .3em; font-size: .68em; font-weight: 700; background: rgba(40, 15, 25, .82); color: #fff; padding: .1em .45em; border-radius: .4em; }
.swatch { display: inline-block; width: .85em; height: .85em; border-radius: 3px; margin-right: .5em; vertical-align: -.08em; border: 1px solid rgba(0, 0, 0, .15); }

/* ---------- sheets ---------- */
.backdrop { position: fixed; inset: 0; background: rgba(30, 10, 15, .58); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
.sheet { width: min(640px, 100%); max-height: 88vh; display: flex; flex-direction: column; background: var(--panel); color: var(--text); border: 1.5px solid var(--line); border-radius: 20px 20px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 700px) { .backdrop { align-items: center; } .sheet { border-radius: 20px; } }
.sheet h3 { font: 700 16px/1.25 var(--ff-display); margin-bottom: 4px; }
.sheet p { margin: 0 0 10px; color: var(--muted); }
.sheet-body { overflow: auto; }
.sheet-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
.opt-sec { margin: 12px 0 6px; font: 700 12px/1.2 var(--ff-display); color: var(--muted); }
.opt { display: flex; align-items: center; width: 100%; text-align: left; margin: 0 0 6px; padding: 10px 12px; min-height: 44px; background: var(--bg2); border: 1.5px solid var(--line); border-radius: 12px; font-weight: 700; }
.opt:hover { border-color: var(--teal); }
.opt.bank { border-style: dashed; }
.cardrow { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 4px; }
.cardrow .desc { font-size: 13.5px; color: var(--muted); }
.paygrid { display: flex; flex-wrap: wrap; gap: 8px; }
.tally { font-weight: 700; margin: 8px 0 0; }
.tally.good { color: var(--teal); }
.rules li { margin-bottom: 6px; }
.logline { font-size: 13px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.waiting { text-align: center; padding: 30px 10px; color: var(--muted); font-size: 15px; }
.waiting b { color: var(--text); }

/* ---------- alert ---------- */
#alertRoot { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 95; pointer-events: none; max-width: min(88vw, 440px); width: max-content; }
.alert-box { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 2px solid var(--cherry); border-radius: 18px; padding: 14px 20px; box-shadow: 0 14px 36px rgba(0, 0, 0, .38); opacity: 0; transform: scale(.9); transition: opacity .18s ease, transform .18s ease; }
.alert-box.show { opacity: 1; transform: scale(1); }
.alert-icon { flex: none; width: 1.9em; height: 1.9em; border-radius: 50%; background: var(--cherry); color: var(--cherry-ink); display: grid; place-items: center; font: 800 1.1em/1 var(--ff-display); }
.alert-text { font: 700 15px/1.35 var(--ff-body); color: var(--text); }

.spinner { display: inline-block; width: 1em; height: 1em; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -.15em; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 640px) {
  .table { grid-template-columns: auto 1fr; }
}
@media (prefers-reduced-motion: reduce) { .alert-box { transition: none; } .spinner { animation: none; } }
</style>
</head>
<body>
<div id="root"></div>
<div id="sheetRoot"></div>
<div id="alertRoot" aria-live="assertive"></div>

<script>
/* Rules engine - Type 1 (cancel-action stops the whole request).
   Pure logic, no DOM. Works in browsers and in Node. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Engine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ---------- utilities ---------- */
  function mulberry32(seed) {
    let a = seed;
    const fn = function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    // Exposes the generator's own internal state as a plain number, so a caller that needs to
    // move this generator across a storage/network boundary (where only plain JSON survives,
    // never a live closure) can save this and later resume the EXACT same sequence via
    // mulberry32(savedState) - not restart it from the original seed, which would silently
    // repeat an earlier shuffle instead of continuing to a fresh one.
    fn.state = () => a;
    return fn;
  }
  function shuffle(arr, rng) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  const ok = (extra) => Object.assign({ ok: true }, extra || {});
  const err = (m) => ({ ok: false, error: m });
  const isCancel = (c) => c.kind === 'action' && c.aid === 'cancel_action';

  /* ---------- deck ---------- */
  function buildDeck(base, theme) {
    let uid = 0; const cards = [];
    for (const m of base.moneyCards) for (let i = 0; i < m.qty; i++)
      cards.push({ uid: uid++, kind: 'money', bank: m.value, name: theme.currency.singular });
    for (const s of base.propertySets) {
      const names = theme.sets[s.id].cards;
      for (let i = 0; i < s.cards; i++)
        cards.push({ uid: uid++, kind: 'property', set: s.id, bank: s.bank, name: names[i] });
    }
    for (const w of base.wildProperties) for (let i = 0; i < w.qty; i++)
      cards.push({ uid: uid++, kind: 'wild', wid: w.id, sets: w.sets.slice(), bank: w.bank, name: theme.wilds[w.id] });
    for (let i = 0; i < base.multiWild.qty; i++)
      cards.push({ uid: uid++, kind: 'multi', bank: 0, name: theme.multiWild });
    for (const r of base.rentCards) for (let i = 0; i < r.qty; i++)
      cards.push({ uid: uid++, kind: 'rent', rid: r.id, sets: r.sets === 'any' ? 'any' : r.sets.slice(),
        target: r.target, bank: r.bank, name: r.target === 'one' ? theme.rent.wild : theme.rent.pair });
    for (const a of base.actionCards) for (let i = 0; i < a.qty; i++)
      cards.push({ uid: uid++, kind: 'action', aid: a.id, bank: a.bank, name: theme.actions[a.id], fx: a.effect });
    return cards;
  }

  /* ---------- state ---------- */
  function newGame(opts) {
    const base = opts.base, theme = opts.theme;
    const rng = mulberry32(opts.seed == null ? 1 : opts.seed);
    const SET = {}; base.propertySets.forEach((s) => { SET[s.id] = s; });
    const state = {
      base, theme, rng, SET, rules: base.rules,
      players: [], drawPile: shuffle(buildDeck(base, theme), rng), playPile: [],
      turn: 0, playsLeft: 0, phase: 'main', discardNeeded: 0, pending: null,
      winner: null, log: [], events: [], gid: 1, turnCount: 0, awaitingDraw: false,
    };
    opts.names.forEach((n, i) => state.players.push({
      id: i, name: n, isHuman: i === (opts.humanIdx == null ? 0 : opts.humanIdx), hand: [], bank: [], groups: [],
    }));
    for (let r = 0; r < base.rules.startingHand; r++)
      for (const p of state.players) p.hand.push(state.drawPile.pop());
    startTurn(state);
    return state;
  }

  const cur = (s) => s.players[s.turn];
  const setName = (s, id) => s.theme.sets[id].name;
  function log(s, text) { s.log.push({ turn: s.turnCount, text }); if (s.log.length > 300) s.log.shift(); }
  function emit(s, ev) { s.events.push(ev); if (s.events.length > 60) s.events.shift(); }
  function opponentsOf(s, p) {
    const out = []; const n = s.players.length;
    for (let i = 1; i < n; i++) out.push(s.players[(p.id + i) % n]);
    return out;
  }

  function draw(s, p, n) {
    let got = 0;
    for (let i = 0; i < n; i++) {
      if (s.drawPile.length === 0) {
        if (s.playPile.length === 0) break;
        s.drawPile = shuffle(s.playPile.splice(0), s.rng);
      }
      p.hand.push(s.drawPile.pop()); got++;
    }
    return got;
  }

  function startTurn(s, opts) {
    const p = cur(s);
    if (opts && opts.skipDraw) {
      s.awaitingDraw = true;
      s.playsLeft = s.rules.playsPerTurn; s.phase = 'main'; s.discardNeeded = 0; s.turnCount++;
      log(s, p.name + ' starts a turn.');
      checkWin(s);
      return;
    }
    const n = p.hand.length === 0 ? s.rules.drawIfHandEmpty : s.rules.drawPerTurn;
    draw(s, p, n);
    s.awaitingDraw = false;
    s.playsLeft = s.rules.playsPerTurn; s.phase = 'main'; s.discardNeeded = 0; s.turnCount++;
    log(s, p.name + ' starts a turn and draws ' + n + '.');
    checkWin(s);
  }

  /* ---------- groups (property collection) ---------- */
  const newGroup = (s, set) => ({ gid: s.gid++, set, cards: [], house: null, hotel: null });
  const groupSize = (s, g) => s.SET[g.set].size;
  const isComplete = (s, g) => g.cards.length >= groupSize(s, g) && g.cards.some((c) => c.kind === 'property');
  function completeSets(s, p) {
    const set = new Set(); p.groups.forEach((g) => { if (isComplete(s, g)) set.add(g.set); }); return set;
  }
  function targetGroup(s, p, setKey) {
    const size = s.SET[setKey].size;
    return p.groups.filter((g) => g.set === setKey && g.cards.length < size)
      .sort((a, b) => b.cards.length - a.cards.length)[0] || null;
  }
  /* Every incomplete group of setKey the player already has, plus the option to start a fresh one.
     Used wherever the PLAYER (not an automatic steal/swap/payment) chooses where a card lands,
     so a colour split across two groups (e.g. one already complete, one just started) can be
     freely consolidated or rearranged rather than being stuck wherever the auto-fill put it. */
  function destinationsFor(s, p, setKey) {
    const size = s.SET[setKey].size;
    const out = p.groups.filter((g) => g.set === setKey && g.cards.length < size)
      .map((g) => ({ gid: g.gid, have: g.cards.length, size }));
    out.push({ gid: 'new', have: 0, size });
    return out;
  }
  function destinationLabel(s, setName_, d) {
    if (d.gid === 'new') return setName_ + ' (start a new group)';
    const willComplete = d.have + 1 >= d.size;
    return setName_ + ' (' + d.have + '/' + d.size + (willComplete ? ' - completes it' : '') + ')';
  }
  function place(s, p, card, setKey, targetGid) {
    card.as = setKey;
    let g = null;
    if (targetGid === 'new') { g = newGroup(s, setKey); p.groups.push(g); }
    else if (targetGid != null) g = p.groups.find((x) => x.gid === targetGid && x.set === setKey && x.cards.length < s.SET[setKey].size);
    if (!g) { g = targetGroup(s, p, setKey); if (!g) { g = newGroup(s, setKey); p.groups.push(g); } }
    g.cards.push(card);
    return g;
  }
  function cleanupGroup(s, p, g) {
    if (g.cards.length === 0) {
      const i = p.groups.indexOf(g); if (i >= 0) p.groups.splice(i, 1);
      if (g.house) { p.bank.push(g.house); g.house = null; }   // orphaned buildings become inert bank money
      if (g.hotel) { p.bank.push(g.hotel); g.hotel = null; }
    }
  }
  function bestSetFor(s, p, card) {
    const options = card.kind === 'wild' ? card.sets : Object.keys(s.SET);
    let best = null, bs = -1e9;
    for (const k of options) {
      const size = s.SET[k].size, g = targetGroup(s, p, k), have = g ? g.cards.length : 0;
      let sc = (have / size) * 10 + (have + 1 === size ? 20 : 0) + s.SET[k].bank;
      if (!g) sc -= 2;
      if (sc > bs) { bs = sc; best = k; }
    }
    return best;
  }
  function receiveProperty(s, p, card) {
    return place(s, p, card, card.kind === 'property' ? card.set : bestSetFor(s, p, card));
  }
  function groupRent(s, g) {
    if (!g.cards.some((c) => c.kind !== 'multi')) return 0;
    const S = s.SET[g.set];
    let r = S.rent[Math.min(g.cards.length, S.size) - 1];
    if (isComplete(s, g)) { if (g.house) r += g.house.fx.rentBonus; if (g.hotel) r += g.hotel.fx.rentBonus; }
    return r;
  }
  function checkWin(s) {
    if (s.winner != null) return;
    const p = cur(s);
    if (completeSets(s, p).size >= s.rules.setsToWin) {
      s.winner = p.id; s.phase = 'over'; s.pending = null;
      log(s, p.name + ' completes ' + s.rules.setsToWin + ' sets and wins!');
    }
  }

  /* ---------- payments ---------- */
  function payables(s, p) {
    const items = [];
    p.bank.forEach((c) => items.push({ uid: c.uid, card: c, from: 'bank' }));
    p.groups.forEach((g) => {
      g.cards.forEach((c) => { if (c.bank > 0) items.push({ uid: c.uid, card: c, from: 'group', g }); });
      if (g.house) items.push({ uid: g.house.uid, card: g.house, from: 'house', g });
      if (g.hotel) items.push({ uid: g.hotel.uid, card: g.hotel, from: 'hotel', g });
    });
    return items;
  }
  const payableTotal = (s, p) => payables(s, p).reduce((a, i) => a + i.card.bank, 0);

  function validatePayment(s, p, amount, uids) {
    const items = payables(s, p), map = new Map(items.map((i) => [i.uid, i]));
    const seen = new Set(); let sum = 0;
    for (const u of uids) {
      if (!map.has(u) || seen.has(u)) return 'That card cannot be used to pay.';
      seen.add(u); sum += map.get(u).card.bank;
    }
    for (const i of items) {
      if (i.from === 'house' && seen.has(i.uid) && i.g.hotel && !seen.has(i.g.hotel.uid))
        return 'A Hotel must be paid before its House.';
    }
    const total = items.reduce((a, i) => a + i.card.bank, 0);
    if (total <= amount) { if (seen.size !== items.length) return 'You must pay everything you have.'; }
    else if (sum < amount) return 'That is not enough to cover the debt.';
    return null;
  }

  function applyPayment(s, payer, receiver, uids) {
    const map = new Map(payables(s, payer).map((i) => [i.uid, i]));
    const touched = new Set();
    for (const u of uids) {
      const it = map.get(u), c = it.card;
      if (it.from === 'bank') { payer.bank.splice(payer.bank.indexOf(c), 1); receiver.bank.push(c); }
      else if (it.from === 'group') { it.g.cards.splice(it.g.cards.indexOf(c), 1); touched.add(it.g); receiveProperty(s, receiver, c); }
      else { if (it.from === 'house') it.g.house = null; else it.g.hotel = null; receiver.bank.push(c); }  // buildings become bank money
    }
    touched.forEach((g) => cleanupGroup(s, payer, g));
  }

  /* ---------- enumerating legal plays ---------- */
  const keyOf = (it) => [it.type, it.cardUid, it.aid || '', it.set || '', it.gid == null ? '' : it.gid,
    it.target == null ? '' : it.target, it.targetCardUid == null ? '' : it.targetCardUid,
    it.myCardUid == null ? '' : it.myCardUid, (it.doubles || []).join(',')].join('|');

  function cardPlays(s, p, card) {
    const out = []; if (s.playsLeft <= 0 || s.winner != null) return out;
    const opps = opponentsOf(s, p);
    const bankIt = () => out.push({ type: 'bank', cardUid: card.uid, label: 'Bank it for ' + card.bank, section: 'Bank' });
    if (card.kind === 'money') bankIt();
    if (card.kind === 'property')
      destinationsFor(s, p, card.set).forEach((d) => out.push({ type: 'property', cardUid: card.uid, set: card.set, gid: d.gid,
        label: 'Add to ' + destinationLabel(s, setName(s, card.set), d), section: 'Play' }));
    if (card.kind === 'wild')
      card.sets.forEach((k) => destinationsFor(s, p, k).forEach((d) => out.push({ type: 'property', cardUid: card.uid, set: k, gid: d.gid,
        label: 'Play as ' + destinationLabel(s, setName(s, k), d), section: 'Play' })));
    if (card.kind === 'multi')
      Object.keys(s.SET).forEach((k) => destinationsFor(s, p, k).forEach((d) => out.push({ type: 'property', cardUid: card.uid, set: k, gid: d.gid,
        label: 'Play as ' + destinationLabel(s, setName(s, k), d), section: 'Play' })));

    if (card.kind === 'rent') {
      bankIt();
      const sets = card.sets === 'any' ? Object.keys(s.SET) : card.sets;
      const doublesAvail = p.hand.filter((c) => c.kind === 'action' && c.aid === 'double_rent');
      sets.forEach((k) => {
        const gs = p.groups.filter((g) => g.set === k && groupRent(s, g) > 0);
        if (!gs.length) return;
        const best = gs.sort((a, b) => groupRent(s, b) - groupRent(s, a))[0];
        const r = groupRent(s, best);
        const maxD = Math.min(doublesAvail.length, s.playsLeft - 1);
        const targets = card.target === 'one' ? opps : [null];
        for (let d = 0; d <= maxD; d++) for (const t of targets) {
          const amount = r * Math.pow(2, d);
          out.push({ type: 'rent', cardUid: card.uid, set: k, gid: best.gid, target: t ? t.id : null,
            doubles: doublesAvail.slice(0, d).map((c) => c.uid), amount,
            label: (t ? 'Charge ' + t.name : 'Charge everyone') + ' ' + amount + (d ? ' (x' + Math.pow(2, d) + ')' : ''),
            section: setName(s, k) });
        }
      });
    }

    if (card.kind === 'action') {
      const a = card.aid;
      if (a === 'cancel_action' || a === 'double_rent') bankIt();
      if (a === 'draw_extra') { bankIt(); out.push({ type: 'action', aid: a, cardUid: card.uid, label: 'Draw 2 extra cards', section: 'Play' }); }
      if (a === 'building_1' || a === 'building_2') {
        bankIt();
        p.groups.forEach((g) => {
          if (!isComplete(s, g) || !s.SET[g.set].buildable) return;
          if (a === 'building_1' && !g.house) out.push({ type: 'action', aid: a, cardUid: card.uid, gid: g.gid, label: 'Build on ' + setName(s, g.set) + ' (+' + card.fx.rentBonus + ' rent)', section: 'Play' });
          if (a === 'building_2' && g.house && !g.hotel) out.push({ type: 'action', aid: a, cardUid: card.uid, gid: g.gid, label: 'Build on ' + setName(s, g.set) + ' (+' + card.fx.rentBonus + ' rent)', section: 'Play' });
        });
      }
      if (a === 'collect_all') { bankIt(); out.push({ type: 'action', aid: a, cardUid: card.uid, label: 'Everyone pays you ' + card.fx.amount, section: 'Play' }); }
      if (a === 'collect_one') { bankIt(); opps.forEach((t) => out.push({ type: 'action', aid: a, cardUid: card.uid, target: t.id, label: t.name + ' pays you ' + card.fx.amount, section: 'Play' })); }
      if (a === 'steal_set') {
        bankIt();
        opps.forEach((t) => t.groups.forEach((g) => { if (isComplete(s, g))
          out.push({ type: 'action', aid: a, cardUid: card.uid, target: t.id, gid: g.gid, label: 'Take ' + setName(s, g.set) + ' from ' + t.name, section: 'Play' }); }));
      }
      if (a === 'steal_card') {
        bankIt();
        opps.forEach((t) => t.groups.forEach((g) => { if (!isComplete(s, g)) g.cards.forEach((c) =>
          out.push({ type: 'action', aid: a, cardUid: card.uid, target: t.id, gid: g.gid, targetCardUid: c.uid, label: 'Take ' + c.name + ' from ' + t.name, section: 'Play' })); }));
      }
      if (a === 'swap_card') {
        bankIt();
        const mine = [];
        p.groups.forEach((g) => { if (!isComplete(s, g)) g.cards.forEach((c) => mine.push(c)); });
        opps.forEach((t) => {
          t.groups.forEach((g) => {
            if (isComplete(s, g)) return;
            g.cards.forEach((c) => {
              mine.forEach((m) => {
                out.push({ type: 'action', aid: a, cardUid: card.uid, target: t.id, gid: g.gid, targetCardUid: c.uid, myCardUid: m.uid,
                  label: 'Give ' + m.name + ', take ' + c.name, section: 'Swap with ' + t.name });
              });
            });
          });
        });
      }
    }
    return out;
  }

  function wildMoves(s, p) {
    const out = [];
    p.groups.forEach((g) => g.cards.forEach((c) => {
      const colours = c.kind === 'wild' ? c.sets : c.kind === 'multi' ? Object.keys(s.SET) : null;
      if (!colours) return;
      colours.forEach((k) => destinationsFor(s, p, k).forEach((d) => {
        if (k === g.set && d.gid === g.gid) return;   // that is exactly where it already is
        out.push({ cardUid: c.uid, toSet: k, toGid: d.gid, label: destinationLabel(s, setName(s, k), d) });
      }));
    }));
    return out;
  }
  function moveWild(s, cardUid, toSet, toGid) {
    if (s.winner != null || s.phase !== 'main' || s.pending) return err('You cannot rearrange right now.');
    const p = cur(s);
    let g = null, c = null;
    for (const gg of p.groups) { const f = gg.cards.find((x) => x.uid === cardUid); if (f) { g = gg; c = f; } }
    if (!c || (c.kind !== 'wild' && c.kind !== 'multi')) return err('Only wildcards can be moved.');
    if (c.kind === 'wild' && !c.sets.includes(toSet)) return err('This wildcard cannot go there.');
    if (g.set === toSet && (toGid == null || toGid === g.gid)) return err('It is already there.');
    g.cards.splice(g.cards.indexOf(c), 1);
    place(s, p, c, toSet, toGid);
    cleanupGroup(s, p, g);
    log(s, p.name + ' moves ' + c.name + ' to ' + setName(s, toSet) + '.');
    checkWin(s);
    return ok();
  }

  /* ---------- playing a card ---------- */
  function takeFromHand(p, uid) {
    const i = p.hand.findIndex((c) => c.uid === uid);
    return i < 0 ? null : p.hand.splice(i, 1)[0];
  }

  function play(s, it) {
    if (s.winner != null) return err('The game is over.');
    if (s.phase !== 'main') return err('Not in the play phase.');
    if (s.pending) return err('Waiting for a response.');
    const p = cur(s);
    const card = p.hand.find((c) => c.uid === it.cardUid);
    if (!card) return err('That card is not in your hand.');
    const legal = cardPlays(s, p, card).find((x) => keyOf(x) === keyOf(it));
    if (!legal) return err('That play is not allowed.');
    exec(s, p, legal);
    return ok();
  }

  function exec(s, p, it) {
    const card = takeFromHand(p, it.cardUid);
    s.playsLeft--;
    if (it.type === 'bank') { p.bank.push(card); log(s, p.name + ' banks ' + card.name + ' (' + card.bank + ').'); }
    else if (it.type === 'property') { place(s, p, card, it.set, it.gid); log(s, p.name + ' plays ' + card.name + ' into ' + setName(s, it.set) + '.'); }
    else if (it.type === 'rent') {
      s.playPile.push(card);
      it.doubles.forEach((u) => { s.playPile.push(takeFromHand(p, u)); s.playsLeft--; });
      const targets = it.target == null ? opponentsOf(s, p) : [s.players[it.target]];
      const mult = Math.pow(2, it.doubles.length);
      log(s, p.name + ' plays ' + card.name + ' on ' + setName(s, it.set) + ' for ' + it.amount + (mult > 1 ? ' (doubled x' + mult + ')' : '') + '.');
      startPending(s, targets.map((t) => ({ kind: 'rent', from: p.id, to: t.id, amount: it.amount,
        desc: p.name + ' charges you ' + it.amount + ' rent for ' + setName(s, it.set) + (mult > 1 ? ' (doubled x' + mult + ')' : '') + '.' })));
    } else if (it.type === 'action') {
      const a = it.aid;
      if (a === 'draw_extra') { s.playPile.push(card); draw(s, p, card.fx.count); log(s, p.name + ' plays ' + card.name + ' and draws ' + card.fx.count + '.'); }
      else if (a === 'building_1' || a === 'building_2') {
        const g = p.groups.find((x) => x.gid === it.gid);
        if (a === 'building_1') g.house = card; else g.hotel = card;
        log(s, p.name + ' builds ' + card.name + ' on ' + setName(s, g.set) + '.');
      } else if (a === 'collect_all') {
        s.playPile.push(card); log(s, p.name + ' plays ' + card.name + ': everyone pays ' + card.fx.amount + '.');
        startPending(s, opponentsOf(s, p).map((t) => ({ kind: 'collect', from: p.id, to: t.id, amount: card.fx.amount,
          desc: p.name + ' plays ' + card.name + ': you owe ' + card.fx.amount + '.' })));
      } else if (a === 'collect_one') {
        s.playPile.push(card); const t = s.players[it.target];
        log(s, p.name + ' plays ' + card.name + ' on ' + t.name + ' for ' + card.fx.amount + '.');
        startPending(s, [{ kind: 'collect', from: p.id, to: t.id, amount: card.fx.amount, desc: p.name + ' plays ' + card.name + ': you owe ' + card.fx.amount + '.' }]);
      } else if (a === 'steal_set') {
        s.playPile.push(card); const t = s.players[it.target], g = t.groups.find((x) => x.gid === it.gid);
        log(s, p.name + ' plays ' + card.name + ' against ' + t.name + "'s " + setName(s, g.set) + '.');
        startPending(s, [{ kind: 'steal_set', from: p.id, to: t.id, gid: g.gid, desc: p.name + ' wants to take your ' + setName(s, g.set) + ' set.' }]);
      } else if (a === 'steal_card') {
        s.playPile.push(card); const t = s.players[it.target];
        const c = t.groups.find((x) => x.gid === it.gid).cards.find((x) => x.uid === it.targetCardUid);
        log(s, p.name + ' plays ' + card.name + ' to take ' + c.name + ' from ' + t.name + '.');
        startPending(s, [{ kind: 'steal_card', from: p.id, to: t.id, gid: it.gid, cardUid: c.uid, desc: p.name + ' wants to take your ' + c.name + '.' }]);
      } else if (a === 'swap_card') {
        s.playPile.push(card); const t = s.players[it.target];
        const theirs = t.groups.find((x) => x.gid === it.gid).cards.find((x) => x.uid === it.targetCardUid);
        let mine = null; p.groups.forEach((g) => g.cards.forEach((c) => { if (c.uid === it.myCardUid) mine = c; }));
        log(s, p.name + ' plays ' + card.name + ': swapping ' + mine.name + ' for ' + theirs.name + '.');
        startPending(s, [{ kind: 'swap_card', from: p.id, to: t.id, gid: it.gid, cardUid: theirs.uid, myCardUid: mine.uid,
          desc: p.name + ' wants to swap their ' + mine.name + ' for your ' + theirs.name + '.' }]);
      } else { s.playPile.push(card); }
    }
    checkWin(s);
  }

  /* ---------- requests, cancel chains, payment ---------- */
  function startPending(s, reqs) { s.pending = { queue: reqs.slice(), current: null, stage: null, jsnCount: 0, awaiting: null }; advance(s); }

  function settleCancel(s, P, req) {
    const from = s.players[req.from], to = s.players[req.to];
    if (P.jsnCount % 2 === 1) {
      log(s, 'The request against ' + to.name + ' is cancelled.');
      if (from.isHuman) emit(s, { type: 'move_cancelled', byName: to.name });
      P.current = null; return;
    }
    if (req.kind === 'rent' || req.kind === 'collect') { P.stage = 'pay'; return; }
    if (req.kind === 'steal_set') {
      const g = to.groups.find((x) => x.gid === req.gid);
      if (g && isComplete(s, g)) {
        to.groups.splice(to.groups.indexOf(g), 1); from.groups.push(g);
        log(s, from.name + ' takes ' + setName(s, g.set) + ' from ' + to.name + '.');
        if (to.isHuman) emit(s, { type: 'steal_set', fromName: from.name, set: g.set });
      }
    } else if (req.kind === 'steal_card') {
      const g = to.groups.find((x) => x.gid === req.gid), c = g && g.cards.find((x) => x.uid === req.cardUid);
      if (c && !isComplete(s, g)) {
        g.cards.splice(g.cards.indexOf(c), 1); cleanupGroup(s, to, g); receiveProperty(s, from, c);
        log(s, from.name + ' takes ' + c.name + ' from ' + to.name + '.');
        if (to.isHuman) emit(s, { type: 'steal_card', fromName: from.name, cardName: c.name });
      }
    } else if (req.kind === 'swap_card') {
      const g = to.groups.find((x) => x.gid === req.gid), theirs = g && g.cards.find((x) => x.uid === req.cardUid);
      let mg = null, mine = null; from.groups.forEach((gg) => gg.cards.forEach((c) => { if (c.uid === req.myCardUid) { mg = gg; mine = c; } }));
      if (theirs && mine && !isComplete(s, g) && !isComplete(s, mg)) {
        g.cards.splice(g.cards.indexOf(theirs), 1); mg.cards.splice(mg.cards.indexOf(mine), 1);
        cleanupGroup(s, to, g); cleanupGroup(s, from, mg);
        receiveProperty(s, from, theirs); receiveProperty(s, to, mine);
        log(s, from.name + ' swaps ' + mine.name + ' for ' + theirs.name + ' with ' + to.name + '.');
        if (to.isHuman) emit(s, { type: 'swap_card', fromName: from.name, takenName: theirs.name, givenName: mine.name });
      }
    }
    P.current = null;
  }

  function advance(s) {
    const P = s.pending; if (!P) return null;
    for (;;) {
      if (s.winner != null) { s.pending = null; return null; }
      if (!P.current) {
        if (!P.queue.length) { s.pending = null; checkWin(s); return null; }
        P.current = P.queue.shift(); P.jsnCount = 0; P.stage = 'cancel'; P.awaiting = null;
      }
      const req = P.current;
      if (P.stage === 'cancel') {
        const responder = P.jsnCount % 2 === 0 ? s.players[req.to] : s.players[req.from];
        if (responder.hand.some(isCancel)) { P.awaiting = { type: 'cancel', player: responder.id, req, counter: P.jsnCount % 2 === 1 }; return P.awaiting; }
        settleCancel(s, P, req); checkWin(s); continue;
      }
      if (P.stage === 'pay') {
        const debtor = s.players[req.to], creditor = s.players[req.from];
        const items = payables(s, debtor), total = items.reduce((a, i) => a + i.card.bank, 0);
        if (total === 0) { log(s, debtor.name + ' has nothing to pay.'); P.current = null; continue; }
        if (total <= req.amount) {
          applyPayment(s, debtor, creditor, items.map((i) => i.uid));
          log(s, debtor.name + ' pays everything they have (' + total + ') to ' + creditor.name + '.');
          if (debtor.isHuman) emit(s, { type: 'auto_pay', toName: creditor.name, amount: total });
          P.current = null; checkWin(s); continue;
        }
        P.awaiting = { type: 'pay', player: debtor.id, amount: req.amount, req }; return P.awaiting;
      }
    }
  }

  function respond(s, d) {
    const P = s.pending; if (!P || !P.awaiting) return err('Nothing to respond to.');
    const aw = P.awaiting, req = P.current;
    if (aw.type === 'cancel') {
      const pl = s.players[aw.player];
      if (d.use) {
        const i = pl.hand.findIndex(isCancel); if (i < 0) return err('No such card.');
        const c = pl.hand.splice(i, 1)[0]; s.playPile.push(c); P.jsnCount++;
        log(s, pl.name + ' plays ' + c.name + (aw.counter ? ' to cancel the cancel' : '') + '.');
        P.awaiting = null; advance(s); return ok();
      }
      P.awaiting = null; settleCancel(s, P, req); checkWin(s); advance(s); return ok();
    }
    if (aw.type === 'pay') {
      const debtor = s.players[aw.player], creditor = s.players[req.from];
      const e = validatePayment(s, debtor, aw.amount, d.uids || []); if (e) return err(e);
      const sum = payables(s, debtor).filter((i) => d.uids.includes(i.uid)).reduce((a, i) => a + i.card.bank, 0);
      applyPayment(s, debtor, creditor, d.uids);
      log(s, debtor.name + ' pays ' + sum + ' to ' + creditor.name + '.');
      P.current = null; P.awaiting = null; checkWin(s); advance(s); return ok();
    }
    return err('Unknown response.');
  }

  /* ---------- end of turn ---------- */
  function endTurn(s, opts) {
    if (s.winner != null) return err('The game is over.');
    if (s.phase !== 'main' || s.pending) return err('You cannot end the turn now.');
    const p = cur(s), over = p.hand.length - s.rules.handLimit;
    if (over > 0) { s.phase = 'discard'; s.discardNeeded = over; return ok({ needDiscard: over }); }
    nextTurn(s, opts); return ok();
  }
  function discard(s, uids, opts) {
    if (s.phase !== 'discard') return err('No discard needed.');
    const p = cur(s);
    if (uids.length !== s.discardNeeded || new Set(uids).size !== uids.length) return err('Choose exactly ' + s.discardNeeded + ' card(s).');
    if (!uids.every((u) => p.hand.some((c) => c.uid === u))) return err('Those cards are not in your hand.');
    uids.forEach((u) => { s.drawPile.unshift(takeFromHand(p, u)); });   // to the bottom of the draw pile
    log(s, p.name + ' discards ' + uids.length + ' card(s) to the bottom of the draw pile.');
    nextTurn(s, opts); return ok();
  }
  // `opts.skipDraw` advances whose turn it is and resets the per-turn counters, WITHOUT

      if (i.from === 'house' || i.from === 'hotel') return i.card.bank * 2.0;

    const pool = allowed.slice().sort((a, b) => cost(a) / a.card.bank - cost(b) / b.card.bank || a.card.bank - b.card.bank);

      for (const i of pool) { if (sum >= amount) break; chosen.push(i); sum += i.card.bank; }

        if (sum >= amount) break;

        uids.push(i.uid); sum += i.card.bank;
        if (i.from === 'house' && i.g.hotel && !uids.includes(i.g.hotel.uid)) { uids.push(i.g.hotel.uid); sum += i.g.hotel.bank; }

    async writeHand(code, index, cards) { await setDoc(handRef(code, index), { cards }); },
    async readPublic(code) { const s = await getDoc(roomRef(code)); return s.exists() ? s.data() : null; },
    async readHand(code, index) { const s = await getDoc(handRef(code, index)); return s.exists() ? s.data().cards : null; },
    subscribePublic(code, fn, onErr) {
      return onSnapshot(roomRef(code), (s) => fn(s.exists() ? s.data() : null),
        (e) => { console.error('room subscription error:', e); if (onErr) onErr(e); });
    },
    subscribeHand(code, index, fn, onErr) {
      return onSnapshot(handRef(code, index), (s) => fn(s.exists() ? s.data().cards : null),
        (e) => { console.error('hand subscription error:', e); if (onErr) onErr(e); });
    },
  };
}

function locateCard(g, uid) {

    let c = p.hand.find((x) => x.uid === uid) || p.bank.find((x) => x.uid === uid);
    if (c) return c;
    for (const gr of p.groups) { c = gr.cards.find((x) => x.uid === uid); if (c) return c; }
  }
  return null;
}
function cardSwatchColor(c) {
  if (!c) return null;

  return null;
}
function optionSwatch(g, it) {
  if (it.type === 'property' || it.type === 'rent') return setColor(it.set);
  if (it.type !== 'action') return null;
  if (it.aid === 'steal_set') { const gr = g.players[it.target].groups.find((x) => x.gid === it.gid); return gr ? setColor(gr.set) : null; }

}

const ALERT_MS = 2000;
function reduced() { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
function eventText(ev) {
  if (ev.type === 'steal_set') return ev.fromName + ' took your ' + setName(ev.set) + '.';
  if (ev.type === 'steal_card') return ev.fromName + ' took ' + ev.cardName + ' from you.';
  if (ev.type === 'swap_card') return ev.fromName + ' swapped their ' + ev.givenName + ' for your ' + ev.takenName + '.';
  if (ev.type === 'auto_pay') return 'You paid everything you had (' + ev.amount + ') to ' + ev.toName + '.';
  if (ev.type === 'move_cancelled') return ev.byName + ' played ' + THEME.actions.cancel_action + ' and cancelled your move!';
  return '';
}
function queueAlert(text) { alertQueue.push(text); pumpAlert(); }
function pumpAlert() {
  if (alertCurrent || !alertQueue.length) return;
  alertCurrent = { text: alertQueue.shift(), show: reduced() };
  renderAlert();
  if (!reduced()) setTimeout(() => { if (alertCurrent) { alertCurrent.show = true; renderAlert(); } }, 20);
  setTimeout(() => { alertCurrent = null; renderAlert(); pumpAlert(); }, ALERT_MS);
}
function renderAlert() {
  $('#alertRoot').innerHTML = alertCurrent
    ? '<div class="alert-box' + (alertCurrent.show ? ' show' : '') + '"><span class="alert-icon">!</span><span class="alert-text">' + esc(alertCurrent.text) + '</span></div>'
    : '';
}
function drainEvents(g) {
  if (!g) return;
  if (g.events.length < seenEvents) seenEvents = 0;
  for (; seenEvents < g.events.length; seenEvents++) { const t = eventText(g.events[seenEvents]); if (t) queueAlert(t); }
}

    return { title: aw.counter ? 'They cancelled your play' : 'A request is coming for you', sub: esc(aw.req.desc),
      body: '<p>' + (aw.counter ? 'Play your own ' + esc(jsn.name) + ' to cancel their cancel.' : 'Play ' + esc(jsn.name) + ' to cancel the whole request.') + '</p>',
      foot: '<button class="btn" data-act="cancelno">' + (aw.counter ? 'Let it stand' : 'Take it') + '</button><button class="btn primary" data-act="cancelyes">Play ' + esc(jsn.name) + '</button>' };
  }
  if (s.type === 'pay') {
    const items = E.payables(g, g.players[room.myIndex]), sum = items.filter((i) => s.sel.has(i.uid)).reduce((a, i) => a + i.card.bank, 0), aw = s.aw;
    const grid = items.map((i) => cardHTML(i.card, { sm: true, sel: s.sel.has(i.uid), showLadder: true, tag: i.from === 'bank' ? 'jar' : i.from === 'group' ? 'menu' : 'building', attrs: 'data-act="paytoggle" data-uid="' + i.uid + '"' })).join('');
    return { title: 'You owe ' + aw.amount, sub: esc(aw.req.desc), body: '<div class="paygrid">' + grid + '</div><p class="tally' + (sum >= aw.amount ? ' good' : '') + '">Selected ' + sum + ' of ' + aw.amount + '</p><p class="err">' + esc(s.err || '') + '</p>',
      foot: '<button class="btn primary" data-act="payconfirm"' + (sum >= aw.amount ? '' : ' disabled') + '>Pay ' + sum + '</button>' };
  }
  if (s.type === 'discard') {
    const me = g.players[room.myIndex], need = g.discardNeeded;
    const grid = me.hand.map((c) => cardHTML(c, { sm: true, sel: s.sel.has(c.uid), attrs: 'data-act="disctoggle" data-uid="' + c.uid + '"' })).join('');
    return { title: 'Discard ' + need + (need === 1 ? ' card' : ' cards'), sub: 'You can keep 7 cards.', body: '<div class="paygrid">' + grid + '</div><p class="tally' + (s.sel.size === need ? ' good' : '') + '">Selected ' + s.sel.size + ' of ' + need + '</p>',
      foot: '<button class="btn primary" data-act="discconfirm"' + (s.sel.size === need ? '' : ' disabled') + '>Discard</button>' };
  }
  if (s.type === 'over') {
    const w = g.players[g.winner], sets = [...E.completeSets(g, w)];
    return { title: w.id === room.myIndex ? 'You win!' : w.name + ' wins', sub: 'Completed: ' + sets.map((k) => esc(setName(k))).join(', ') + '.',
      body: '<p style="font:700 20px var(--ff-display)">' + (w.id === room.myIndex ? 'Three menus, all yours.' : 'Better luck next time.') + '</p>', foot: '' };
  }
  return { title: '', sub: '', body: '', foot: '' };
}

// ============================================================
// Screens
// ============================================================
function renderRoot() {
  const root = $('#root');
  if (screen === 'loading') { root.innerHTML = '<div class="wrap"><div class="centerCard"><p>Connecting…</p></div></div>'; return; }
  if (screen === 'landing') { root.innerHTML = renderLanding(); return; }
  if (screen === 'lobby') { root.innerHTML = renderLobby(); return; }
  if (screen === 'game') { root.innerHTML = renderGame(); renderSheet(); return; }
}
function renderLanding() {
  return '<div class="wrap"><div class="centerCard">' +
    '<h1>Café — play with family</h1><p class="sub">Enter your name, then create a new table or join one with a code.</p>' +
    '<div class="field"><label>Your name</label><input type="text" id="nameInput" maxlength="20" placeholder="e.g. Jackson" value="' + esc(nameField) + '"></div>' +
    '<div class="field"><label>Room code (only if joining)</label><input type="text" id="codeInput" maxlength="6" style="text-transform:uppercase" placeholder="e.g. AB2XQ" value="' + esc(joinCodeField) + '"></div>' +
    '<p class="err">' + esc(errorMsg) + '</p>' +
    '<div class="seg"><button class="btn primary" data-act="createRoom"' + (busy ? ' disabled' : '') + '>' + (busy ? '<span class="spinner"></span> ' : '') + 'Create a table</button>' +
    '<button class="btn" data-act="joinRoom"' + (busy ? ' disabled' : '') + '>Join with code</button></div>' +
    '</div></div>';
}
function renderLobby() {
  const doc = room.doc, isHost = room.myIndex === doc.hostIndex;
  const link = location.origin + location.pathname + '?room=' + room.code;
  return '<div class="wrap"><div class="centerCard">' +
    '<h1>Waiting for players</h1><p class="sub">Share this code or link with family.</p>' +
    '<div class="roomcode">' + esc(room.code) + '</div>' +
    '<div class="sharebar"><input type="text" readonly value="' + esc(link) + '" id="shareLink"><button class="btn" data-act="copyLink">Copy link</button></div>' +
    '<ul class="playerlist">' + doc.playerNames.map((n, i) => '<li>' + esc(n) + (i === doc.hostIndex ? '<span class="tag">Host</span>' : '') + (i === room.myIndex ? ' (you)' : '') + '</li>').join('') + '</ul>' +
    (isHost
      ? '<button class="btn primary" data-act="startGame"' + (room.canStart() && !busy ? '' : ' disabled') + ' style="width:100%">' + (busy ? '<span class="spinner"></span> ' : '') + 'Start game (' + doc.playerNames.length + (doc.playerNames.length === 1 ? ' player' : ' players') + ')</button>'
      : '<p class="hint">Waiting for the host to start the game once everyone has joined (2–5 players).</p>') +
    '<p class="err">' + esc(errorMsg) + '</p>' +
    '</div></div>';
}
function renderGame() {
  const g = room.merged();
  if (!g) return '<div class="wrap"><div class="centerCard"><p>Loading game…</p></div></div>';
  drainEvents(g);
  const myIdx = room.myIndex, me = g.players[myIdx];
  const actingIdx = S.actingIndex(g);
  const isMine = actingIdx === myIdx;

  const opps = g.players.map((p, i) => {
    if (i === myIdx) return '';
    const active = actingIdx === i;
    return '<button class="opp' + (active ? ' active' : '') + '" data-act="opp" data-id="' + i + '">' +
      '<div class="oname">' + esc(p.name) + '<span class="meta">' + p.hand.length + ' cards</span><span class="meta">jar ' + p.bank.reduce((a, c) => a + c.bank, 0) + '</span></div>' +
      '<div class="ogroups">' + (p.groups.length ? p.groups.map((gr) => chipHTML(g, gr)).join('') : '<span class="empty-note">No menus yet</span>') + '</div></button>';
  }).join('');

  const top = g.playPile[g.playPile.length - 1];
  const statusText = g.winner != null ? g.players[g.winner].name + ' won'
    : isMine ? (g.awaitingDraw ? 'Drawing…' : 'Your turn') : g.players[actingIdx].name + ' is playing';

  const groups = me.groups.length ? me.groups.map((gr) => {
    const size = DECK.propertySets.find((s) => s.id === gr.set).size, done = E.isComplete(g, gr);
    const cards = gr.cards.map((c) => cardHTML(c, { sm: true, attrs: (c.kind === 'wild' || c.kind === 'multi') && isMine ? 'data-act="move" data-uid="' + c.uid + '"' : 'disabled', tag: (c.kind === 'wild' || c.kind === 'multi') && isMine ? 'move' : '' })).join('');
    return '<div class="grp' + (done ? ' done' : '') + '" style="--set:' + setColor(gr.set) + '"><div class="ghead">' + esc(setName(gr.set)) + '<span class="cnt">' + gr.cards.length + '/' + size + '</span>' + (done ? '<span class="ok">complete</span>' : '') + '<span class="cnt">rent ' + E.groupRent(g, gr) + '</span></div><div class="gcards">' + cards + '</div>' +
      (gr.house ? '<span class="pill">' + esc(gr.house.name) + '</span>' : '') + (gr.hotel ? '<span class="pill">' + esc(gr.hotel.name) + '</span>' : '') + '</div>';
  }).join('') : '<div class="empty-groups">Add menu items here to build menus. Complete three different menus to win.</div>';

  const handCards = me.hand.map((c) => cardHTML(c, { dim: isMine && E.cardPlays(g, me, c).length === 0, attrs: (isMine && !busy) ? 'data-act="card" data-uid="' + c.uid + '"' : 'disabled' })).join('');

  return '<div class="wrap">' +
    '<header class="top"><h1>Café<small>Room ' + esc(room.code) + '</small></h1>' +
    '<button class="btn" data-act="rules">Rules</button><button class="btn" data-act="log">Log</button><button class="btn" data-act="theme">Light/dark</button></header>' +
    '<section class="opps">' + opps + '</section>' +
    '<section class="table"><div class="piles"><div class="pile draw"><div><b>' + g.drawPile.length + '</b>draw pile</div></div><div class="pile play"><div>' + (top ? esc(top.name) : 'played cards') + '</div></div></div>' +
    '<div class="status"><p class="now' + (isMine ? ' mine' : '') + '">' + esc(statusText) + '</p><ul class="ticker">' + g.log.slice(-9).map((l) => '<li>' + esc(l.text) + '</li>').join('') + '</ul></div>' +
    '<div><button class="btn" data-act="end"' + (isMine && g.phase === 'main' && !g.pending && !g.awaitingDraw ? '' : ' disabled') + '>' + (busy ? '<span class="spinner"></span>' : 'End turn') + '</button></div></section>' +
    '<section class="me"><h2>Your menus<span>' + [...E.completeSets(g, me)].length + ' of ' + g.rules.setsToWin + ' complete</span><button class="btn" data-act="bank">Tip jar: ' + me.bank.reduce((a, c) => a + c.bank, 0) + '</button></h2><div class="groups">' + groups + '</div></section>' +
    '<section class="handbar"><h2>Your hand (' + me.hand.length + ')</h2><div class="hand">' + (me.hand.length ? handCards : '<div class="hand-empty">Your hand is empty.</div>') + '</div></section>' +
    '</div>';
}

// ============================================================
// Game action helpers
// ============================================================
async function doAct(fn) {
  if (busy) return;
  busy = true; renderRoot();
  let r;
  try {
    r = await room.act(fn);
  } catch (err) {
    busy = false;
    console.error('action failed unexpectedly:', err && err.stack || err);
    renderRoot();
    return { ok: false, error: 'Something went wrong. Please try again.' };
  }
  busy = false;
  if (!r.ok) { console.warn(r.error); }
  renderRoot();
  return r;
}
function watchAwaitingDraw() {
  const g = room.merged();
  if (g && g.awaitingDraw && S.actingIndex(g) === room.myIndex && !busy) {
    doAct((gg) => { const p = gg.players[gg.turn]; const n = p.hand.length === 0 ? gg.rules.drawIfHandEmpty : gg.rules.drawPerTurn; E.draw(gg, p, n); gg.awaitingDraw = false; return { ok: true }; });
  }
}
function syncPrompt() {
  const g = room.merged();
  if (!g) return;
  if (g.winner != null) { if (!sheet || sheet.type !== 'over') openSheet({ type: 'over' }); return; }
  const aw = g.pending && g.pending.awaiting;
  if (aw && aw.player === room.myIndex) {
    const key = aw.type + ':' + g.log.length;
    if (aw.type === 'cancel' && (!sheet || sheet.key !== key)) openSheet({ type: 'cancel', aw, key });
    else if (aw.type === 'pay' && (!sheet || sheet.key !== key)) openSheet({ type: 'pay', aw, key, sel: new Set(), err: '' });
  } else if (g.phase === 'discard' && room.myIndex === g.turn) {
    if (!sheet || sheet.type !== 'discard') openSheet({ type: 'discard', sel: new Set() });
  } else if (sheet && ['cancel', 'pay', 'discard'].includes(sheet.type)) {
    closeSheet();
  }
  watchAwaitingDraw();
}

// ============================================================
// Events
// ============================================================
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;

  if (a === 'theme') {
    const root = document.documentElement, dark = getComputedStyle(root).getPropertyValue('--bg').trim().toLowerCase() === '#241220';
    root.dataset.theme = dark ? 'light' : 'dark'; return;
  }
  if (screen === 'landing') {
    nameField = $('#nameInput') ? $('#nameInput').value.trim() : nameField;
    joinCodeField = $('#codeInput') ? $('#codeInput').value.trim().toUpperCase() : joinCodeField;
    if (a === 'createRoom' || a === 'joinRoom') {
      if (!nameField) { errorMsg = 'Please enter your name.'; renderRoot(); return; }
      busy = true; errorMsg = ''; renderRoot();
      try {
        if (a === 'createRoom') room = await RoomLib.create(store, nameField);
        else {
          if (!joinCodeField) { errorMsg = 'Please enter a room code.'; busy = false; renderRoot(); return; }
          room = await RoomLib.join(store, joinCodeField, nameField);
          if (!room) { errorMsg = 'That room code wasn\u2019t found, is full, or has already started.'; busy = false; renderRoot(); return; }
        }
        saveSession(room.code);
        busy = false;
        enterRoom();
      } catch (err) { errorMsg = 'Something went wrong: ' + (err && err.message || err); busy = false; renderRoot(); }
      return;
    }
    return;
  }
  if (screen === 'lobby') {
    if (a === 'copyLink') { $('#shareLink').select(); try { await navigator.clipboard.writeText($('#shareLink').value); } catch (err) { document.execCommand('copy'); } return; }
    if (a === 'startGame') {
      busy = true; errorMsg = ''; renderRoot();
      const r = await room.startGame(DECK, THEME);
      busy = false;
      if (!r.ok) { errorMsg = r.error; renderRoot(); }
      return;
    }
    return;
  }
  if (screen !== 'game') return;

  if (a === 'close') { closeSheet(); return; }
  if (a === 'rules') { openSheet({ type: 'rules' }); return; }
  if (a === 'log') { openSheet({ type: 'log' }); return; }
  if (a === 'bank') { openSheet({ type: 'bank' }); return; }
  if (a === 'opp') { openSheet({ type: 'opp', id: +el.dataset.id }); return; }

  const g = room.merged();
  if (a === 'card') {
    const me = g.players[room.myIndex]; const c = me.hand.find((x) => x.uid === +el.dataset.uid); if (!c) return;
    const opts = E.cardPlays(g, me, c);
    const sh = { type: 'card', card: c, options: opts };
    if (c.kind === 'action' && c.aid === 'swap_card' && opts.some((o) => o.type === 'action' && o.aid === 'swap_card')) sh.swapStep = 'give';
    openSheet(sh); return;
  }
  if (a === 'swapgive') { sheet.swapStep = 'take'; sheet.swapGiveUid = +el.dataset.uid; renderSheet(); return; }
  if (a === 'swapback') { sheet.swapStep = 'give'; sheet.swapGiveUid = null; renderSheet(); return; }
  if (a === 'play') {
    const it = sheet.options[+el.dataset.i]; closeSheet();
    await doAct((gg) => E.play(gg, it)); return;
  }
  if (a === 'move') {
    const me = g.players[room.myIndex]; const c = me.groups.flatMap((gr) => gr.cards).find((x) => x.uid === +el.dataset.uid);
    if (c) openSheet({ type: 'move', card: c }); return;
  }
  if (a === 'domove') {
    const me = g.players[room.myIndex];
    const m = E.wildMoves(g, me).filter((x) => x.cardUid === sheet.card.uid)[+el.dataset.i];
    closeSheet(); await doAct((gg) => E.moveWild(gg, m.cardUid, m.toSet, m.toGid)); return;
  }
  if (a === 'cancelyes' || a === 'cancelno') {
    closeSheet(); await doAct((gg) => E.respond(gg, { use: a === 'cancelyes' })); return;
  }
  if (a === 'paytoggle') { const u = +el.dataset.uid; if (sheet.sel.has(u)) sheet.sel.delete(u); else sheet.sel.add(u); sheet.err = ''; renderSheet(); return; }
  if (a === 'payconfirm') {
    const sel = [...sheet.sel]; closeSheet();
    const r = await doAct((gg) => E.respond(gg, { uids: sel }));
    if (r && !r.ok) { openSheet({ type: 'pay', aw: room.merged().pending.awaiting, sel: new Set(sel), err: r.error }); }
    return;
  }
  if (a === 'disctoggle') { const u = +el.dataset.uid; if (sheet.sel.has(u)) sheet.sel.delete(u); else if (sheet.sel.size < g.discardNeeded) sheet.sel.add(u); renderSheet(); return; }
  if (a === 'discconfirm') { const sel = [...sheet.sel]; closeSheet(); await doAct((gg) => E.discard(gg, sel, { skipDraw: true })); return; }
  if (a === 'end') {
    const r = await doAct((gg) => E.endTurn(gg, { skipDraw: true }));
    if (r && r.ok && r.result && r.result.needDiscard) { /* syncPrompt will open the discard sheet */ }
    return;
  }
});

// ============================================================
// Boot
// ============================================================
function enterRoom() {
  screen = room.merged() ? 'game' : 'lobby';
  room.subscribe(() => {
    screen = room.doc && room.doc.status === 'lobby' ? 'lobby' : 'game';
    renderRoot();
    if (screen === 'game') syncPrompt();
  });
}

async function boot() {
  try {
    store = await createFirebaseStore(firebaseConfig);
  } catch (err) {
    $('#root').innerHTML = '<div class="wrap"><div class="centerCard"><h1>Could not connect</h1><p class="sub">' + esc(err && err.message || err) + '</p></div></div>';
    return;
  }
  try { nameField = localStorage.getItem('mp_player_name') || ''; } catch (e) {}
  const urlCode = new URLSearchParams(location.search).get('room');
  let savedCode = null;
  try { savedCode = localStorage.getItem('mp_room_code'); } catch (e) {}
  const tryCode = savedCode || urlCode;
  if (tryCode) {
    const rejoined = await RoomLib.rejoinByIdentity(store, tryCode.toUpperCase());
    if (rejoined) { room = rejoined; saveSession(room.code); enterRoom(); return; }
    if (urlCode) joinCodeField = urlCode.toUpperCase();
    clearSession();
  }
  screen = 'landing';
  renderRoot();
}

screen = 'loading'; renderRoot();
boot();

</script>
</body>
